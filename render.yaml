services:
  - type: web
    name: ai-business-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set this in the Render Dashboard securely
      - key: JWT_SECRET
        sync: false # Set this in the Render Dashboard securely
      - key: ANTHROPIC_API_KEY
        sync: false # Set this in the Render Dashboard securely
      - key: GROQ_API_KEY
        sync: false # Set this in the Render Dashboard securely
      - key: REFRESH_TOKEN_SECRET
        sync: false # Set this in the Render Dashboard securely
      - key: CORS_ORIGIN
        sync: false # Set this to your Vercel URL once deployed
